# Daily check: opens an issue if no blog post has today's UTC pubDate.
name: Publishing watchdog

on:
  schedule:
    - cron: '0 12 * * *' # 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for a post dated today (UTC)
        id: check
        run: |
          node <<'NODE'
          const fs = require('fs');
          const dir = 'src/content/blog';
          const today = new Date().toISOString().slice(0, 10);
          let newest = '';
          let hasToday = false;
          for (const f of fs.readdirSync(dir).filter((f) => f.endsWith('.md'))) {
            const src = fs.readFileSync(`${dir}/${f}`, 'utf8');
            const fm = src.replace(/^﻿/, '').match(/^---\r?\n([\s\S]*?)\r?\n---/);
            if (!fm) continue;
            const m = fm[1].match(/^pubDate:\s*["']?(\d{4}-\d{2}-\d{2})/m);
            if (!m) continue;
            if (/^draft:\s*true/m.test(fm[1])) continue;
            if (m[1] > newest) newest = m[1];
            if (m[1] === today) hasToday = true;
          }
          console.log(`today=${today} newest=${newest || 'none'} hasToday=${hasToday}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `today=${today}\nnewest=${newest || 'none'}\nhas_today=${hasToday}\n`);
          NODE

      - name: Open an issue if nothing was published
        if: steps.check.outputs.has_today != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TODAY: ${{ steps.check.outputs.today }}
          NEWEST: ${{ steps.check.outputs.newest }}
        run: |
          TITLE="No blog post published today ($TODAY)"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json title --jq "[.[] | select(.title == \"$TITLE\")] | length")
          if [ "$EXISTING" != "0" ]; then
            echo "Issue already open, nothing to do."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
            --body "The daily watchdog found no post with pubDate $TODAY (UTC). Newest pubDate in the repo: $NEWEST. Check the publishing routine and the deploy workflow."
